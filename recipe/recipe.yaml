context:
  version: "0.2.2"

package:
  name: kiri
  version: ${{ version }}

source:
  url: https://github.com/libracoder/kiri/archive/v${{ version }}.tar.gz
  sha256: aaa88911bdfc8e83253cefc9cfd884c3d0aa55ee9dc1f67a19b94564dde6fbbf

build:
  skip:
    - win
  number: 1
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - if: osx
        # objc2 looks up classes via objc_getClass, so -dead_strip_dylibs drops Virtualization/AppKit/WebKit/Foundation.
        then: export CARGO_BUILD_RUSTFLAGS="${CARGO_BUILD_RUSTFLAGS//-C link-arg=-Wl,-dead_strip_dylibs/}"
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml
      - cargo auditable install -j ${CPU_COUNT} --root "${PREFIX}" --locked --no-track --path crates/kiri
      - if: osx
        # Virtualization.framework refuses to start a VM without this entitlement.
        then: /usr/bin/codesign --force --sign - --entitlements crates/kiri/kiri.entitlements "${PREFIX}/bin/kiri"
      - if: linux
        then: cargo auditable install -j ${CPU_COUNT} --root "${PREFIX}" --locked --no-track --path crates/kiri-init

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable

tests:
  - script:
      - kiri || true
      - if: osx
        then:
          - otool -L "${PREFIX}/bin/kiri" | grep -q Virtualization.framework
          - /usr/bin/codesign -d --entitlements - --xml "${PREFIX}/bin/kiri" 2>&1 | grep -q com.apple.security.virtualization
  - package_contents:
      strict: true
      bin:
        - kiri
        - if: linux
          then: kiri-init

about:
  homepage: https://github.com/libracoder/kiri
  summary: "A small, fast container runtime for macOS, Windows and Linux with free Ngrok alternative."
  description: |
    Kiri is a lightweight replacement for Docker Desktop and OrbStack, written in Rust. It runs containers in one small Linux VM (or straight on the kernel on Linux) and speaks the Docker Engine API, so your tools just work.
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/libracoder/kiri

extra:
  recipe-maintainers:
    - XhstormR
