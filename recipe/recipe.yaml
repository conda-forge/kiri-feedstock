context:
  version: "0.2.2"

package:
  name: kiri
  version: ${{ version }}

source:
  url: https://github.com/libracoder/kiri/archive/v${{ version }}.tar.gz
  sha256: aaa88911bdfc8e83253cefc9cfd884c3d0aa55ee9dc1f67a19b94564dde6fbbf

build:
  skip:
    - osx
  number: 1
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml
      - if: unix
        then:
          - cargo auditable install -j ${CPU_COUNT} --root "${PREFIX}" --locked --no-track --path crates/kiri
          - if: linux
            then: cargo auditable install -j ${CPU_COUNT} --root "${PREFIX}" --locked --no-track --path crates/kiri-init
        else:
          - cargo auditable install -j %CPU_COUNT% --root "%LIBRARY_PREFIX%" --locked --no-track --path crates/kiri
          - cargo auditable install -j %CPU_COUNT% --root "%LIBRARY_PREFIX%" --locked --no-track --path crates/kiri-win

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable

tests:
  - script:
      - if: unix
        then: kiri || true
        else: 'kiri 2>&1 | findstr /C:"usage: kiri"'
  - package_contents:
      strict: true
      bin:
        - kiri
        - if: linux
          then: kiri-init
        - if: win
          then: kiri-win

about:
  homepage: https://github.com/libracoder/kiri
  summary: "A small, fast container runtime for macOS, Windows and Linux with free Ngrok alternative."
  description: |
    Kiri is a lightweight replacement for Docker Desktop and OrbStack, written in Rust. It runs containers in one small Linux VM (or straight on the kernel on Linux) and speaks the Docker Engine API, so your tools just work.
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/libracoder/kiri

extra:
  recipe-maintainers:
    - XhstormR
